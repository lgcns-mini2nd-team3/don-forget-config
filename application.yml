eureka:
    client:
        service-url:
            defaultZone: http://localhost:8761/eureka/

# eureka:
#     client:
#         enabled: false

spring:
    rabbitmq:
        host: rabbitmq-service
        port: 5672
        username: guest
        password: guest

    datasource:
        url: jdbc:mariadb://${DB_HOST}:3306/inspire?useSSL=true&requireSSL=true  
        username: ${DB_ADMIN}  
        password: ${DB_PASSWORD}

    jpa:
        database: mysql
        database-platform: org.hibernate.dialect.MariaDBDialect
        hibernate:
            ddl-auto: create
        show-sql: true
            
    data:
        redis:
            host: redis-service
            port: 6379
            password: 
            timeout: 6000s
            
    cloud:
        bus:
            enabled: true
            
