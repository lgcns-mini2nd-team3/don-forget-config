server:
  port: 8087  

spring:
  application:
    name: external-billing-service 

  datasource:

    url: jdbc:mariadb://localhost:3307/user_bill?useSSL=false&characterEncoding=UTF-8&serverTimezone=UTC
    driver-class-name: org.mariadb.jdbc.Driver
    username: root
    password: password 

  jpa:
   
    hibernate:
      ddl-auto: update
    show-sql: true 
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MariaDBDialect

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true