server:
  port: 8080 

spring:
  application:
    name: external-billing-service
  datasource:
    url: jdbc:mariadb://${DB_HOST}:3306/inspire?useSSL=false&characterEncoding=UTF-8&serverTimezone=UTC
    username: ${DB_ADMIN}
    password: ${DB_PASSWORD}
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update 
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MariaDBDialect


  kafka:
    bootstrap-servers: kafka-service:9092

eureka:
  client:
    service-url:
      defaultZone: http://eureka-service:8761/eureka/

feign:
  circuitbreaker:
    enabled: true

resilience4j:
  circuitbreaker:
    instances:
  
      externalBillingService:
        failureRateThreshold: 40
        waitDurationInOpenState: 10000 


jwt:
  secret: ogolgye-super-secret-key-for-jwt-forwebstudy